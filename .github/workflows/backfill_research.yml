name: Backfill research 10y
# Dataset de investigación (data/research/). Manual: Actions → este workflow → Run workflow.
# Corre acá y no en Railway porque Railway tiene yfinance fijado en 0.2.54 y
# Yahoo ya no le responde; acá se instala la versión actual (igual que download_data.yml).
# No toca los CSV de producción ni dispara el pipeline.
# Programado de martes a sábado 01:30 UTC (después de la descarga de 23:00 UTC)
# para que la capa de cartera (src/capa_cartera.py) tenga datos del día hábil anterior.
on:
  schedule:
    - cron: '30 1 * * 2-6'
  workflow_dispatch:
    inputs:
      modo:
        description: "prueba (2 tickers x mercado, no commitea) o aplicar (completo + commit)"
        required: true
        default: "aplicar"
        type: choice
        options:
          - aplicar
          - prueba

concurrency:
  group: download-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy pytz requests

      - name: Backfill 10 años
        run: |
          if [ "${{ inputs.modo || 'aplicar' }}" = "aplicar" ]; then
            python scripts/backfill_precios_10y.py --aplicar --no-push
          else
            python scripts/backfill_precios_10y.py --no-push
          fi

      - name: Commit y push de data/research
        if: (inputs.modo || 'aplicar') == 'aplicar'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/research/*.csv data/research/backfill_meta.json
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "research: backfill 10y $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull origin main --rebase --autostash
          git push
